# GitHub Pages / Jekyll Configuration
title: "Charif MOUMOUNI"
logo: IMG/1793955704951.jpg
description: "Portfolio en Analyse de Données, Économétrie & Intelligence Artificielle"
show_downloads: true

# Thème GitHub Pages (ex: jekyll-theme-cayman, jekyll-theme-architect, jekyll-theme-slate, jekyll-theme-modernist)
