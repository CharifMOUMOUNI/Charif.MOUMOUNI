# Paramètres généraux
lang: fr-FR
encoding: utf-8

# Rendu Markdown
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
